name: Build Patchwork APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source from Google Drive
        run: |
          curl -L -o src.zip "https://drive.usercontent.google.com/download?id=1ktQMbcBCsO7VMMDmVoJzGXXR6ygEJT6J&export=download&confirm=t"
          unzip -q -o src.zip || { echo "::error::Download from Google Drive failed"; exit 1; }
      - name: Apply fixes
        run: |
          # Fix 1: remove a comment line that broke Recipes.kt (nested /* in a comment)
          sed -i '/assets\/tracking\/\*\*"},/d' Patchwork/app/src/main/java/app/patchwork/Recipes.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: Patchwork
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; then
            {
              echo "## Build errors"
              echo '```'
              grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: |error:" build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../Patchwork.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Patchwork APK (build ${{ github.run_number }})
          files: Patchwork.apk
