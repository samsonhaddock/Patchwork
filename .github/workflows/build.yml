name: Build Patchwork APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source from Google Drive
        run: |
          curl -L -o src.zip "https://drive.usercontent.google.com/download?id=1ktQMbcBCsO7VMMDmVoJzGXXR6ygEJT6J&export=download&confirm=t"
          unzip -q src.zip || { echo "Download failed"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: Patchwork
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Patchwork.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Patchwork APK (build ${{ github.run_number }})
          files: Patchwork.apk
